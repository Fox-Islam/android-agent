org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# Without this the Kotlin daemon inherits org.gradle.jvmargs, so two JVMs are each entitled
# to 3g. On a WSL2 VM that also has an emulator in it, that is what runs the box out of
# memory during a cold assembleRelease
kotlin.daemon.jvmargs=-Xmx1500m
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
