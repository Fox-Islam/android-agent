name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tag ahead of versionName would publish v1.1.0 containing android-agent-1.0.0.apk.
      # Checked before the build so it costs seconds
      - name: The tag and the build file must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Tag refs are read-only by default, which stops a release saving what it
          # downloads and makes every run re-resolve the whole dependency graph
          cache-read-only: false

      # setup-gradle caches GRADLE_USER_HOME but not this, which is ~28s of task graph
      - name: Cache the Gradle configuration cache
        uses: actions/cache@v4
        with:
          path: .gradle/configuration-cache
          key: config-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: config-cache-${{ runner.os }}-

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set - the APK would be unsigned."
            exit 1
          fi
          # Outside the workspace so it can never be picked up by a build artifact glob
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sideload.jks"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/sideload.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        # No --no-daemon: the Gradle action manages the daemon and reuses its warm JVM
        run: ./gradlew :app:assembleRelease

      - name: Name the APK after its version
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "android-agent-$VERSION.apk"
          echo "path=android-agent-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Verify it is actually signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}"

      - name: Always remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/sideload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.path }}
          path: ${{ steps.apk.outputs.path }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The bare name is what /releases/latest/download/android-agent.apk resolves to;
          # the versioned one is what tells two downloads apart
          cp "${{ steps.apk.outputs.path }}" android-agent.apk
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.apk.outputs.path }}" android-agent.apk \
            --title "${GITHUB_REF_NAME}" --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" \
                 "${{ steps.apk.outputs.path }}" android-agent.apk --clobber
